# GitHub Actions workflow for continuous integration
# Runs on all PRs and pushes to main

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BUN_VERSION: '1.3.4'

jobs:
  # Linting and type checking
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run typecheck

      - name: Lint TypeScript
        run: bun run lint:ts

      - name: Lint CSS
        run: bun run lint:css

      - name: Lint Markdown
        run: bun run lint:md

      - name: Check formatting
        run: bun run lint:format

  # Unit and integration tests
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun run test

  # Build verification (ensure builds succeed on all platforms)
  build:
    name: Build (${{ matrix.os }})
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            build_command: bun run build:windows
          - os: ubuntu-latest
            platform: linux
            build_command: bun run build:linux
          - os: macos-latest
            platform: macos
            build_command: bun run build:macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Build application
        run: ${{ matrix.build_command }}

      - name: Verify build output exists
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" == "windows" ]; then
            if [ ! -d "build/Windows x64" ]; then
              echo "Windows build output not found"
              exit 1
            fi
          elif [ "${{ matrix.platform }}" == "linux" ]; then
            if [ ! -d "dist/chess-sensei" ]; then
              echo "Linux build output not found"
              exit 1
            fi
          elif [ "${{ matrix.platform }}" == "macos" ]; then
            if [ ! -d "dist/chess-sensei" ]; then
              echo "macOS build output not found"
              exit 1
            fi
          fi
          echo "Build output verified for ${{ matrix.platform }}"
